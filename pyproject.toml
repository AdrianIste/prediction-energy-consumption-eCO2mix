[project]
name = "load-forecast"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Adrian", email = "iste.adrian@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.156.7",
    "holidays>=0.106",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "uvicorn>=0.54.0",
    "xgboost>=3.4.1",
]

[project.scripts]
load-forecast = "load_forecast:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "ipykernel>=7.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
